# Floem's winit, rev 133268de, with one change: see patches/README.md.
[package]
description = "Winit's X11 backend"
edition = "2021"
license = "Apache-2.0"
name = "floem-winit-x11"
repository = "https://github.com/lapce/winit"
rust-version = "1.80"
version = "25.10.0"

[features]
serde = ["dep:serde", "bitflags/serde", "smol_str/serde", "dpi/serde"]

[dependencies]
bitflags = "2"
cursor-icon = "1.1.0"
dpi = { git = "https://github.com/lapce/winit", rev = "133268de675a4fda70816d78a7a1435eb972fea1" }
rwh_06 = { package = "raw-window-handle", version = "0.6", features = ["std"] }
serde = { version = "1", features = ["serde_derive"], optional = true }
smol_str = "0.3"
tracing = { version = "0.1.40", default-features = false }
winit-core = { package = "floem-winit-core", git = "https://github.com/lapce/winit", rev = "133268de675a4fda70816d78a7a1435eb972fea1" }

# Platform-specific
bytemuck = { version = "1.13.1", default-features = false }
calloop = "0.14.3"
libc = "0.2.64"
percent-encoding = "2.0"
rustix = { version = "1.0.7", default-features = false, features = ["std", "system", "thread", "process"] }
winit-common = { package = "floem-winit-common", git = "https://github.com/lapce/winit", rev = "133268de675a4fda70816d78a7a1435eb972fea1", features = ["xkb", "x11"] }
x11-dl = "2.19.1"
x11rb = { version = "0.13.0", default-features = false, features = [
    "allow-unsafe-code",
    "cursor",
    "dl-libxcb",
    "randr",
    "resource_manager",
    "sync",
    "xinput",
    "xkb",
] }
xkbcommon-dl = { version = "0.4.2", features = ["x11"] }

[package.metadata.docs.rs]
all-features = true
