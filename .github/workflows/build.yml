name: Build

# The Windows app and the wb-agent it carries, built the same way for CI and
# for releases. The callers get two artifacts: wb-agent-linux and
# pi-workbench-windows (the app, its installer, and the browser folder the
# app carries: wb-browser with CEF's files).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  agent:
    name: wb-agent for WSL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain in rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      # Static, so it runs in any WSL distro.
      - run: cargo build -p wb-agent --release --locked --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: wb-agent-linux
          path: target/x86_64-unknown-linux-musl/release/wb-agent
          if-no-files-found: error

  windows:
    name: Windows app
    needs: agent
    runs-on: windows-latest
    env:
      WB_AGENT_BUNDLE: ${{ github.workspace }}\artifacts\wb-agent
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: wb-agent-linux
          path: artifacts
      - run: npm ci
        working-directory: app/ui
      - run: npm run build
        working-directory: app/ui
      - run: cargo clippy -p pi-workbench --all-targets --locked -- -D warnings
      # CEF's wrapper builds with CMake and Ninja, in the MSVC environment.
      - uses: ilammy/msvc-dev-cmd@v1
      - run: cargo build -p wb-browser --release --locked
      # Its build puts CEF's files beside it; the app carries both in browser/.
      - name: Gather wb-browser and CEF's files
        shell: pwsh
        run: |
          $release = 'target/release'
          $browser = "$release/browser"
          New-Item -ItemType Directory -Force "$browser/locales" | Out-Null
          Copy-Item "$release/wb-browser.exe" $browser
          Get-ChildItem $release -File |
            Where-Object { $_.Extension -in '.dll', '.pak', '.dat', '.bin' -or $_.Name -in 'vk_swiftshader_icd.json', 'CREDITS.html' } |
            Copy-Item -Destination $browser
          Copy-Item "$release/locales/*" "$browser/locales"
          if (-not (Test-Path "$browser/libcef.dll")) { throw "CEF's files aren't beside wb-browser" }
          Get-ChildItem $browser -File | Format-Table Name, Length
      - run: npm run tauri -- build --config src-tauri/tauri.browser.conf.json
        working-directory: app/ui
      - uses: actions/upload-artifact@v4
        with:
          name: pi-workbench-windows
          path: |
            target/release/pi-workbench.exe
            target/release/bundle/nsis/*.exe
            target/release/browser/
          if-no-files-found: error
          # It's large with CEF in it; a release takes it at once.
          retention-days: 1
