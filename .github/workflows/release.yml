name: Release

on:
  push:
    tags: ['v*']
    # A version bump reaching main releases it; path filters do not apply
    # to tags.
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # What to release: a pushed tag as it is; otherwise (a version bump on main,
  # or a run by hand) the workspace version, unless it already has its tag.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [[ -z "$version" ]]; then
            echo "::error::No workspace version in Cargo.toml"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version has its tag already; nothing to release"
          else
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04's glibc (2.35) keeps the binary runnable on older WSL and Linux installs.
          - os: ubuntu-22.04
            asset: pi-workbench-x86_64-linux.tar.gz
          - os: windows-latest
            asset: pi-workbench-x86_64-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-dev
      - run: cargo build --release --locked -p pi-workbench
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/pi-workbench
          cp target/release/pi-workbench scripts/install-wsl.sh README.md dist/pi-workbench/
          tar -C dist -czf ${{ matrix.asset }} pi-workbench
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/pi-workbench | Out-Null
          Copy-Item target/release/pi-workbench.exe, README.md dist/pi-workbench/
          Compress-Archive -Path dist/pi-workbench -DestinationPath ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        # A release made by hand for the tag gets the files too, rather than
        # the run failing with them unpublished. A new release makes its tag
        # on the commit built, when it has none yet.
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" assets/* --target "$GITHUB_SHA" \
              --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi
