name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04's glibc (2.35) keeps the binary runnable on older WSL and Linux installs.
          - os: ubuntu-22.04
            asset: pi-workbench-x86_64-linux.tar.gz
          - os: windows-latest
            asset: pi-workbench-x86_64-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-dev
      - run: cargo build --release --locked -p pi-workbench
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/pi-workbench
          cp target/release/pi-workbench scripts/install-wsl.sh README.md dist/pi-workbench/
          tar -C dist -czf ${{ matrix.asset }} pi-workbench
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/pi-workbench | Out-Null
          Copy-Item target/release/pi-workbench.exe, README.md dist/pi-workbench/
          Compress-Archive -Path dist/pi-workbench -DestinationPath ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # A release made by hand for the tag gets the files too, rather than
        # the run failing with them unpublished.
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" assets/* \
              --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi
