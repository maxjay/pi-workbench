name: Release

# Publishes the Windows app as a GitHub release. A pushed tag (vX.Y.Z)
# releases that commit; a version bump in Cargo.toml reaching main releases
# the new version; a run by hand releases the version on the branch it runs
# on. A version with a pre-release part (1.0.0-alpha.1) is a pre-release.
# A run by hand can also delete every other release once this one is up;
# their tags stay.
#
# The files are CI's build of the same commit, waited for if it's still
# going; only when CI has none (it failed, or its files have expired) does
# the release build them itself.

on:
  push:
    tags: ['v*']
    # Path filters don't apply to tags.
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:
    inputs:
      delete_others:
        description: Delete every other release once this one is published (tags are kept)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [[ -z "$version" ]]; then
            echo "::error::No workspace version in Cargo.toml"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match the version in Cargo.toml ($version)"
              exit 1
            fi
          elif git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is released already; nothing to do"
            exit 0
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  ci:
    name: CI's build
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.find.outputs.run }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: find
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [[ -z "$run" ]]; then
            echo "No CI run for $GITHUB_SHA; the release builds it"
            exit 0
          fi
          # Waits for it, if it's still going.
          if ! gh run watch "$run" --repo "$GITHUB_REPOSITORY" --exit-status > /dev/null; then
            echo "CI run $run didn't pass; the release builds it"
            exit 0
          fi
          have=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" \
            --jq '[.artifacts[] | select(.expired | not) | .name] | sort | join(" ")')
          if [[ "$have" != "pi-workbench-windows wb-agent-linux" ]]; then
            echo "CI run $run's files are gone; the release builds them"
            exit 0
          fi
          echo "Using CI run $run's build"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: [version, ci]
    if: needs.version.outputs.tag != '' && needs.ci.outputs.run == ''
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish
    needs: [version, ci, build]
    # Runs with the build skipped, when CI's is used.
    if: >-
      always() && needs.version.outputs.tag != '' && needs.ci.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: built
          run-id: ${{ needs.ci.outputs.run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Name the files
        run: |
          version="${TAG#v}"
          mkdir assets
          cp "$(find built/pi-workbench-windows -name '*-setup.exe')" "assets/pi-workbench-$version-windows-x64-setup.exe"
          (cd built/pi-workbench-windows && zip -qr "../../assets/pi-workbench-$version-windows-x64-portable.zip" pi-workbench.exe browser)
          cp built/wb-agent-linux/wb-agent "assets/wb-agent-$version-linux-x64"
          (cd assets && sha256sum * > SHA256SUMS)
          cat assets/SHA256SUMS
      - name: Publish
        # A release made by hand for the tag gets the files too. A new one
        # makes its tag on the commit built, when it has none yet.
        run: |
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Pi Workbench $TAG" "${prerelease[@]}" --generate-notes --notes "$(cat <<'NOTES'
          ## Install

          You need Windows 10 or 11 with WSL, a default distro, and Pi installed in it.

          - **Installer:** `pi-workbench-…-windows-x64-setup.exe` installs for your user only, no admin rights needed.
          - **Portable:** unzip `pi-workbench-…-windows-x64-portable.zip` anywhere and run `pi-workbench.exe`, no installing. Keep the `browser` folder beside it: it's the browser behind web tabs.

          On first start the app installs wb-agent into `~/.local/bin` in your default WSL distro.
          `wb-agent-…-linux-x64` is the same binary, for installing it by hand.

          The builds aren't signed yet, so Windows SmartScreen may warn: choose **More info › Run anyway**.
          NOTES
          )"
          fi
      - name: Delete the other releases
        if: inputs.delete_others
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName' |
            grep -vxF "$TAG" |
            while read -r tag; do
              echo "Deleting the release for $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
            done
