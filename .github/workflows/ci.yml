name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: protocol and wb-agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p protocol -p wb-agent --all-targets --locked -- -D warnings
      - run: cargo test -p protocol -p wb-agent --locked
      - name: The generated TypeScript is committed
        run: |
          git add --intent-to-add app/ui/src/protocol
          git diff --exit-code -- app/ui/src/protocol

  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  build:
    name: Build
    uses: ./.github/workflows/build.yml
