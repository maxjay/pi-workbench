name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - name: Capture native Linux preview
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb xauth xdotool imagemagick mesa-vulkan-drivers fonts-dejavu-core
          bash scripts/capture-preview.sh
      - name: Upload native preview
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-workbench-linux-preview
          path: artifacts/
          if-no-files-found: error
