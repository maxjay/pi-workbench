# Every push to v2 and every pull request: the Rust side on Linux, the page,
# and the Windows app with its installer, which carries wbd. A tag like
# v2.0.0-alpha.1: also publish the app and its installer as a release, and on
# workbench.maxjay.dev (site.yml).
name: ci

on:
  push:
    branches: [v2]
    tags: ["v2*"]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch replaces the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: protocol and wbd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The app installs the wbd it carries only when its version is not the
      # one WSL has. So every release needs a version of its own, and the tag
      # is how that is checked.
      - name: The tag is the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME is not the version in Cargo.toml (v$version)"
            exit 1
          fi
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: cargo fmt -p protocol -p wbd -- --check
      - run: cargo clippy -p protocol -p wbd --all-targets --locked -- -D warnings
      - run: cargo test -p protocol -p wbd --locked
      # The tests write the page's TypeScript types. They must match what is committed.
      - run: git diff --exit-code app/ui/src/protocol
      # The wbd the app carries. Static, so it runs in any WSL distro.
      - run: rustup target add x86_64-unknown-linux-musl
      - run: cargo build -p wbd --release --locked --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v7
        with:
          name: wbd-linux
          path: target/x86_64-unknown-linux-musl/release/wbd
          if-no-files-found: error

  ui:
    name: the page
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  app:
    name: the Windows app
    needs: rust
    runs-on: windows-latest
    env:
      WBD_BUNDLE: ${{ github.workspace }}\artifacts\wbd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy; rustup default stable
      - uses: actions/download-artifact@v8
        with:
          name: wbd-linux
          path: artifacts
      - run: npm ci
        working-directory: app/ui
      - run: cargo fmt -p workbench -- --check
      - run: cargo clippy -p workbench --locked -- -D warnings
      # Builds the page, the app, and the installer that carries wbd.
      - run: npm run tauri -- build
        working-directory: app/ui
      # The app is one file that runs by itself. It goes out beside its installer,
      # under the installer's name without "-setup".
      - name: Name the app as its installer is named
        shell: bash
        run: |
          setup=$(ls target/release/bundle/nsis/*-setup.exe)
          cp target/release/workbench.exe "${setup%-setup.exe}.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: workbench-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: publish the installer
    if: startsWith(github.ref, 'refs/tags/v2')
    needs: [ui, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: workbench-windows
      # A version with a part after a dash (2.0.0-alpha.1) is a pre-release.
      - run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" *.exe --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" "${prerelease[@]}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  # The release's app and installer go up on workbench.maxjay.dev, with the page.
  site:
    needs: release
    uses: ./.github/workflows/site.yml
    secrets: inherit
