name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: protocol and wb-agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain in rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p protocol -p wb-agent --all-targets --locked -- -D warnings
      - run: cargo test -p protocol -p wb-agent --locked
      - name: The generated TypeScript is committed
        run: |
          git add --intent-to-add app/ui/src/protocol
          git diff --exit-code -- app/ui/src/protocol
      - name: Build wb-agent for WSL
        run: cargo build -p wb-agent --release --locked --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: wb-agent-linux
          path: target/x86_64-unknown-linux-musl/release/wb-agent
          if-no-files-found: error

  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  windows:
    name: Windows app
    needs: agent
    runs-on: windows-latest
    env:
      WB_AGENT_BUNDLE: ${{ github.workspace }}\artifacts\wb-agent
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: wb-agent-linux
          path: artifacts
      - run: npm ci
        working-directory: app/ui
      - run: npm run build
        working-directory: app/ui
      - run: cargo clippy -p pi-workbench --all-targets --locked -- -D warnings
      - run: npm run tauri -- build
        working-directory: app/ui
      - uses: actions/upload-artifact@v4
        with:
          name: pi-workbench-windows
          path: |
            target/release/pi-workbench.exe
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
