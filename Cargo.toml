[workspace]
members = ["crates/protocol", "crates/wbd", "app/src-tauri"]
resolver = "3"

[workspace.package]
version = "2.0.0-alpha.10"
edition = "2024"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
protocol = { path = "crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"
tokio = { version = "1", features = ["rt", "macros", "io-std", "io-util", "process", "sync", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
