[workspace]
members = ["crates/workbench-core", "crates/workbench-text", "crates/pi-client", "apps/desktop"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.91"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
anyhow = "1"
workbench-core = { path = "crates/workbench-core" }
workbench-text = { path = "crates/workbench-text" }
pi-client = { path = "crates/pi-client" }
floem = { git = "https://github.com/lapce/floem", rev = "1351ffb162faeb8be983f1301d718a0d5fb59c27", default-features = false, features = ["editor", "vger"] }

# WSLg's mouse taken for a pen under X11: see patches/README.md.
[patch."https://github.com/lapce/winit"]
floem-winit-x11 = { path = "patches/winit-x11" }

[profile.dev]
debug = 0

# Floem's editor checks, in debug builds only, that every wrapped line has a
# layout. Changing the window's zoom trips it for a moment, before the
# editors lay their lines out again at the new zoom (ui/editor.rs). Release
# builds have no such check; this keeps debug builds running the same way.
[profile.dev.package.floem]
debug-assertions = false

# tiny-skia, the software renderer, asserts in debug builds when a fill under
# two pixels wide straddles a pixel edge and leaves no whole pixel between;
# a text cursor at some offsets does. Release builds draw the edges and go on.
[profile.dev.package.tiny-skia]
debug-assertions = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
