[workspace]
members = ["crates/protocol", "crates/agent", "app/src-tauri"]
resolver = "3"

[workspace.package]
version = "1.0.0-alpha.3"
edition = "2024"
rust-version = "1.91"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
protocol = { path = "crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
ts-rs = "12"
tokio = { version = "1", features = ["rt", "macros", "io-std", "io-util", "process", "sync", "time", "net"] }
tempfile = "3"
base64 = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
