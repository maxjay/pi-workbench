[workspace]
members = ["crates/workbench-core", "crates/workbench-text", "crates/pi-client", "apps/desktop"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.91"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
anyhow = "1"
workbench-core = { path = "crates/workbench-core" }
workbench-text = { path = "crates/workbench-text" }
pi-client = { path = "crates/pi-client" }
floem = { git = "https://github.com/lapce/floem", rev = "1351ffb162faeb8be983f1301d718a0d5fb59c27", default-features = false, features = ["editor", "vger"] }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
